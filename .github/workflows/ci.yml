name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suites
        run: |
          python tests/run_calibrated_env_tests.py
          python tests/test_planner_providers.py
          python tests/test_decision_engine.py
          python tests/test_executor_adapter.py
          python tests/test_monitoring_feedback.py
          python tests/test_live_ecommerce_and_adapters.py
