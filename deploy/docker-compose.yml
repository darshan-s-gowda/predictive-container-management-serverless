services:
  shoppulse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SHOPPULSE_HOST=0.0.0.0
      - PLANNER_BACKEND=${PLANNER_BACKEND:-local}
      - PLANNER_ENDPOINT=${PLANNER_ENDPOINT:-http://host.docker.internal:11434}
      - PLANNER_MODEL=${PLANNER_MODEL:-qwen3:8b}

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - shoppulse

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
